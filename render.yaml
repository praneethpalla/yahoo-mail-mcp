# Render.com deployment configuration
# This file enables automatic deployments from your GitHub repository

services:
  # Web service for the Yahoo Mail MCP Server
  - type: web
    name: yahoo-mail-mcp-server
    runtime: docker
    plan: free  # Change to 'starter' or higher for production use
    region: oregon  # Choose: oregon, frankfurt, singapore, ohio

    # Build configuration
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Environment variables (set sensitive values in Render Dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRANSPORT_MODE
        value: http  # Streamable HTTP at /mcp + legacy SSE at /mcp/sse
      - key: PORT
        fromService:
          type: web
          name: yahoo-mail-mcp-server
          property: port
      - key: YAHOO_EMAIL
        sync: false  # Set this in Render Dashboard (Settings > Environment)
      # The app password is read from a Render Secret File named "yahoo-app-password"
      # (Dashboard > Environment > Secret Files), never from an environment variable
      - key: YAHOO_APP_PASSWORD_COMMAND
        value: cat /etc/secrets/yahoo-app-password
      - key: OAUTH_CLIENT_ID
        sync: false  # Required: the server refuses to start without OAuth (openssl rand -hex 16)
      - key: OAUTH_CLIENT_SECRET
        sync: false  # Required (openssl rand -hex 32); changing it logs out every connected client
      - key: AUTH_USERNAME
        sync: false  # Required: sign-in name (npm run setup-login)
      - key: AUTH_PASSWORD_HASH
        sync: false  # Required: scrypt hash from npm run setup-login (never the plain password)
      - key: AUTH_TOTP_SECRET
        sync: false  # Recommended: authenticator secret from npm run setup-login
      - key: TRUST_PROXY
        value: "1"   # Render runs behind one proxy; makes sign-in lockouts per client address

    # Health check configuration
    healthCheckPath: /health

    # Auto-deploy settings
    autoDeploy: true

    # Scaling (for paid plans)
    numInstances: 1

    # Resource limits (for paid plans)
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
